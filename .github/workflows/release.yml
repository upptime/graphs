name: Release CI

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Build, test, and release
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Node.js for legacy build
        uses: actions/setup-node@v4
        with:
          node-version: 14
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm run test

      - name: Setup Node.js for npm trusted publishing
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GIT_AUTHOR_NAME: "Koj Bot"
          GIT_AUTHOR_EMAIL: "bot@koj.co"
          GIT_COMMITTER_NAME: "Koj Bot"
          GIT_COMMITTER_EMAIL: "bot@koj.co"
        run: |
          NPM_EXE=$(npx npm@latest exec -- node -p "process.env.npm_execpath")
          NPM_PACKAGE_DIR=$(dirname "$(dirname "$NPM_EXE")")
          NPM_BIN_DIR=$(dirname "$NPM_PACKAGE_DIR")/.bin
          export PATH="$NPM_BIN_DIR:$PATH"
          npm --version
          ./node_modules/.bin/semantic-release
